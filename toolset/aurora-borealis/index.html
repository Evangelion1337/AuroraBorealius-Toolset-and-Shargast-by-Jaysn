<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link data-trunk rel="rust" data-target-name="aurora_borealis"/>
  <title>The Aurora BorealiuS Toolset</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #aaa; font-family: sans-serif; font-size: 1.2rem;
      z-index: 1000; pointer-events: none;
    }
    #file-input-area {
      position: fixed; bottom: 8px; left: 8px; z-index: 10;
      display: flex; gap: 6px; align-items: center;
    }
    #file-input-area input { display: none; }
    #file-input-area label {
      background: #333; color: #ccc; padding: 4px 10px;
      border-radius: 4px; cursor: pointer; font-family: sans-serif;
      font-size: 12px; border: 1px solid #555; user-select: none;
    }
    #file-input-area label:hover { background: #444; }
    #file-input-area #file-name {
      color: #888; font-family: monospace; font-size: 11px;
      max-width: 240px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Aurora BorealiuS Toolset...</div>
  <canvas id="canvas_id"></canvas>
  <div id="file-input-area">
    <input type="file" id="mod-file-input" accept=".mod,.MOD"/>
    <label for="mod-file-input">Open Module...</label>
    <span id="file-name"></span>
  </div>
  <script>
    document.addEventListener("TrunkApplicationStarted", async () => {
      const { WebHandle } = window.wasmBindings;
      document.getElementById('loading').remove();
      const handle = new WebHandle();
      await handle.start(document.getElementById('canvas_id'));

      const fileInput = document.getElementById('mod-file-input');
      const fileName = document.getElementById('file-name');
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileName.textContent = file.name;
        const buf = await file.arrayBuffer();
        handle.load_module(file.name, new Uint8Array(buf));
      });
    });
  </script>
</body>
</html>
