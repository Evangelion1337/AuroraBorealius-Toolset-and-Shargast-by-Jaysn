<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
<script type="module">
import init, * as bindings from '/aurora-borealis-4c2e079429b9eb20.js';
const wasm = await init({ module_or_path: '/aurora-borealis-4c2e079429b9eb20_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <title>The Aurora BorealiuS Toolset</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #aaa; font-family: sans-serif; font-size: 1.2rem;
      z-index: 1000; pointer-events: none;
    }
    #file-input-area {
      position: fixed; bottom: 8px; left: 8px; z-index: 10;
      display: flex; gap: 6px; align-items: center;
    }
    #file-input-area input { display: none; }
    #file-input-area label {
      background: #333; color: #ccc; padding: 4px 10px;
      border-radius: 4px; cursor: pointer; font-family: sans-serif;
      font-size: 12px; border: 1px solid #555; user-select: none;
    }
    #file-input-area label:hover { background: #444; }
    #file-input-area #file-name {
      color: #888; font-family: monospace; font-size: 11px;
      max-width: 240px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
<link rel="modulepreload" href="/aurora-borealis-4c2e079429b9eb20.js" crossorigin="anonymous" integrity="sha384-rdmsrEaySDyb6gylpKXi0N+lQnVpCdr6MSNfZNNW/2X3K5VMc5gf+wAm9Fohf8Ek"><link rel="preload" href="/aurora-borealis-4c2e079429b9eb20_bg.wasm" crossorigin="anonymous" integrity="sha384-vRDE0CdzO2qKNLEbxIhl9vmVfwOzvnFlTh61xUYsCqsoK9s64TTsy30kJK0NjnAp" as="fetch" type="application/wasm"></head>
<body>
  <div id="loading">Loading Aurora BorealiuS Toolset...</div>
  <canvas id="canvas_id"></canvas>
  <div id="file-input-area">
    <input type="file" id="mod-file-input" accept=".mod,.MOD"/>
    <label for="mod-file-input">Open Module...</label>
    <span id="file-name"></span>
  </div>
  <script>
    document.addEventListener("TrunkApplicationStarted", async () => {
      const { WebHandle } = window.wasmBindings;
      document.getElementById('loading').remove();
      const handle = new WebHandle();
      await handle.start(document.getElementById('canvas_id'));

      const fileInput = document.getElementById('mod-file-input');
      const fileName = document.getElementById('file-name');
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileName.textContent = file.name;
        const buf = await file.arrayBuffer();
        handle.load_module(file.name, new Uint8Array(buf));
      });
    });
  </script>
<script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>
</html>
